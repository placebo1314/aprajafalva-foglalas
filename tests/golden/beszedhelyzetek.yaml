# BESZÉDHELYZETEK — a golden set harmadik halmaza.
#
# A `nyelvi_alap.yaml` azt méri, HOGYAN mondja a vásárló (köznyelv,
# tájszólás, szleng, töredék). Ez a halmaz azt méri, MILYEN HELYZETBEN
# beszél: nem magának foglal, feltételesen tervez, összehasonlít,
# elköszön, meggondolja magát, közbekérdez. A mondat felszíne itt
# köznyelvi — a nehézség a beszédhelyzetben van, nem a szavakban.
#
# **A várt viselkedés sokszor a VISSZAKÉRDEZÉS vagy az udvarias
# elhárítás, nem a tökéletes megoldás.** Ez a halmaz szándékosan tele
# van olyan kérésekkel, amiket a v1 rendszer nem tud teljesíteni (két
# időpont egyszerre, boltok összehasonlítása, korábbi foglalásra
# hivatkozás azonosítás nélkül). A helyes válasz ilyenkor NEM az, hogy
# valamit mégis csinálunk — hanem hogy kérdezünk, vagy megmondjuk, hogy
# ez nem megy. A rossz válasz a kitalált foglalás.
#
# **Kétféle pontozás, szándékosan** (mindkettő a `futtato.py`-ban él
# már):
#
# - `varhato.parameterek` — EGY helyes válasz, pontos egyezéssel. Ott
#   használjuk, ahol a helyzet zajos, de a kérés egyértelmű.
# - `varhato.elfogadhato_eszkozok` — a NEM ÁRTÓ viselkedések listája.
#   Ott használjuk, ahol két válasz is védhető (keresés vagy kérdés), és
#   a mérésnek nem szabad úgy tennie, mintha egy önkényesen kiválasztott
#   lenne az egyetlen jó. Az „ártó" itt nem elvont: kitalált foglalás,
#   kitalált tény, vagy egy olyan keresés, amit a vásárló épp visszavont.
#
# A `most` = 2026-08-17 (hétfő), ugyanaz, mint a nyelvi halmazban —
# a két halmaz dátumai így összevethetők.
#
# `igenyel_llm: true` szinte mindenhol: ezek a helyzetek mondattani és
# pragmatikai megértést kívánnak (ki beszél kiről, mi a feltétel, mi a
# kérdés a kérdésen belül), amit egy szólistás réteg elvileg nem tud.
# A determinisztikus regressziós védőháló ezért kihagyja őket
# (`tests/egyseg/test_rule_based_golden_set.py`), a mérés nem.

meta:
  verzio: 1
  fajta: beszedhelyzetek
  most_alapertelmezett: "2026-08-17T09:00:00Z"   # hétfő
  kuszobok:
    # A küszöb CÉL, nem a mai szint — ugyanaz a konvenció, mint a nyelvi
    # halmazban (ott a `koznyelvi` 0,98-as küszöbe is teljesületlen). A
    # 2026-08-31-i első mérés (`qwen3.5:9b`, `forditott`, v1 prompt)
    # kilenc rétegből nyolcon 100%-ot adott; egyetlen réteg marad a
    # küszöb alatt, a `kozbevetes` (66,7%) — a számok és a bukott eset
    # elemzése: `docs/BESZEDHELYZETEK_MERES.md`.
    #
    # A DETERMINISZTIKUS futás (`--ertelmezo szabaly`) ezeket a
    # küszöböket nem tartja, és nem is kell tartania: a halmaz minden
    # esete `igenyel_llm: true`. A szabály-alapú alapvonal 69,6% —
    # összehasonlítási pont, nem elvárás.
    masnak: 0.90
    felteteles: 0.90
    osszehasonlitas: 0.90
    korabbi_foglalas: 0.90
    tobb_idopont: 0.90
    udvariassag: 0.90
    meggondolas: 0.90
    kozbevetes: 0.90
    szohasznalat: 0.90
    # 2026-09-05-i bővítés — két új beszédhelyzet, mérés előtt felvett
    # 0,90-es céllal (a mai szintjüket a jelentés írja le, nem a küszöb).
    surgosseg: 0.90
    mas_csatorna: 0.90
    # ÉLES PRÓBÁBÓL származó esetek (2026-09-05) — l. a réteg fejlécét.
    elesbol: 0.90
    # ELSŐ TALÁLKOZÁS (ADR-032) — a bevezetési rés esetei.
    elso_talalkozas: 0.90

esetek:

  # ---------------------------------------------------------------------
  # 1. réteg — nem magának foglal (3 eset)
  #
  # A foglalásnak NINCS „kinek" mezője: a rendszer időpontot foglal, nem
  # személyt azonosít (a vásárlói kulcs csak a megerősítésnél kerül elő,
  # hash-elve — `privacy/`). A helyes viselkedés tehát az, hogy a „kinek"
  # információ NEM zavarja meg a keresést: se visszakérdezés nem lesz
  # belőle, se kitalált mező. Ez a réteg azt méri, hogy a rendszer
  # átlát-e egy nyelvtani alanyváltáson.
  # ---------------------------------------------------------------------

  - id: masnak-01-anyamnak
    bemenet: "Az anyámnak kellene időpont a Szundiba holnapra."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A „kinek" nem paraméter. A kérés minden érdemi eleme megvan (bolt,
      nap), tehát keresni kell — a hibás viselkedés az lenne, ha az
      alanyváltásból („anyámnak") a rendszer hiányzó adatot olvasna ki, és
      visszakérdezne valamire, amit nem is kérdezhetünk meg.
    cimkek: [masnak, alanyvaltas]

  - id: masnak-02-szomszed-nevében
    bemenet: "A szomszéd néni helyett hívok, ő a Törpillához menne pénteken."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-21T00:00:00Z"
        datum_ig: "2026-08-21T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Két szereplő egy mondatban („hívok" — én, „menne" — ő), és a kérés a
      MÁSODIKRA vonatkozik. A mondat nyelvtanilag nehéz, a foglalás
      szempontjából viszont teljesen szokásos.
    cimkek: [masnak, ket_szereplo]

  - id: masnak-03-jogosultsag-kerdes
    bemenet: "Foglalhatok egyáltalán más nevében időpontot?"
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [nincs, visszakerdez]
    megjegyzes: >
      Ez nem foglalási kérés, hanem SZABÁLY-kérdés — és a rendszernek
      nincs olyan tényválasza, ami erre felelne (`bolt_info` „mit"
      enumja: nyitvatartás, cím, termék, időtartam, megjelenés). A helyes
      válasz az udvarias elhárítás vagy a kérdés visszaadása; a rossz az,
      ha a rendszer KITALÁL egy szabályt („igen, természetesen"), amit
      soha senki nem mondott ki. Keresés indítása is hiba lenne: a
      vásárló nem kért időpontot.
    cimkek: [masnak, szabaly_kerdes, hatokoron_kivul]

  # ---------------------------------------------------------------------
  # 2. réteg — feltételes tervezés (2 eset)
  #
  # A feltétel (eső, munka, gyerek) a rendszer számára ISMERETLEN és
  # ISMERHETETLEN. Két helyes út van: ha a feltétel mindkét ága konkrét
  # napot ad, az ablak MINDKETTŐT fedje le (a pontozó úgyis a ténylegesen
  # szabad slotokból választ — `mintan_tul-03` doktrínája); ha a feltétel
  # a foglalás TÉNYÉRE vonatkozik („akkor nem megyek"), akkor nincs mit
  # keresni.
  # ---------------------------------------------------------------------

  - id: felteteles-01-ha-esik-akkor-szerdan
    bemenet: "Ha esik, akkor inkább szerdán mennék a Törpillához, ha nem, akkor kedden."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-19T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Két nap, egy időjárási feltétellel elválasztva. A rendszer nem tudja,
      esni fog-e — de nem is kell tudnia: az ablak lefedi mindkét napot, és
      a vásárló a felajánlott időpontok közül választ. A hibás válasz az
      lenne, ha a rendszer ELDÖNTENÉ a feltételt (kiválasztja a szerdát),
      vagy ha visszakérdezne az időjárásra.
    cimkek: [felteteles, ket_nap]

  - id: felteteles-02-akkor-nem-megyek
    bemenet: "Ha esik az eső, akkor inkább nem megyek sehova."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [nincs, visszakerdez]
    tilos:
      - kitalalt_datum
    megjegyzes: >
      Ugyanaz a nyelvtani szerkezet, ellentétes tartalommal: itt a feltétel
      a foglalás ELMARADÁSÁRÓL szól. Nincs kért nap, nincs bolt, nincs
      kérés — keresést indítani a leggyakoribb hiba lenne, mert a mondat
      tele van „foglalásszagú" szavakkal.
    cimkek: [felteteles, nincs_keres]

  # ---------------------------------------------------------------------
  # 3. réteg — összehasonlítás (2 eset)
  #
  # „Melyik boltban van hamarabb hely?" — a rendszer EGY fordulóban egy
  # eszközt hív, és a boltok NEM alternatívái egymásnak (ADR-024: három
  # különböző termék, nem egy szolgáltatás három telephelye). Az
  # összehasonlítás tehát nem „még nem építettük meg", hanem
  # ÉRTELMETLEN kérdés a domainben — a helyes válasz a kérdés
  # visszaadása: melyikről beszélünk?
  # ---------------------------------------------------------------------

  - id: osszehasonlitas-01-melyik-boltban-hamarabb
    bemenet: "Melyik boltban van hamarabb hely?"
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    reszleges_elfogadas:
      eszkoz: legkozelebbi_idopont
      pontszam: 0.5
    tilos:
      - kitalalt_datum
    megjegyzes: >
      A három bolt három termék (ADR-024) — „hamarabb" csak azon belül
      értelmezhető, amit a vásárló venni akar. A zárt kérdés ezért nem
      kitérés, hanem a kérdés helyretétele. Az EGY boltra adott
      legkorábbi-válasz fél pont: nem árt, de önkényesen választ a
      vásárló helyett.
    cimkek: [osszehasonlitas, bolt_nem_alternativa]

  - id: osszehasonlitas-02-szundi-vagy-torpilla
    bemenet: "A Szundiban vagy a Törpillában van előbb szabad időpont holnap?"
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez, legkozelebbi_idopont, szabad_idopontok]
    megjegyzes: >
      Itt a vásárló MEGNEVEZI a két boltot — az összehasonlítás ettől még
      nem megy egy hívásban, de a kérdés nem is üres. Mindhárom viselkedés
      elfogadható (kérdezz vissza, vagy nézd meg az egyiket), egy nem: a
      kitalált összehasonlító válasz. Ezért mér ez az eset ESZKÖZ-szinten:
      a mérésnek nem szabad úgy tennie, mintha az egyik önkényes választás
      lenne az egyetlen helyes.
    cimkek: [osszehasonlitas, ket_bolt_megnevezve]

  # ---------------------------------------------------------------------
  # 4. réteg — hivatkozás korábbi foglalásra, azonosítás nélkül (2 eset)
  #
  # „Ugyanoda, mint múltkor" — a rendszer NEM tudja, ki beszél. A korábbi
  # foglalás lekérdezése hitelesítést kíván (`foglalas_lekerdezes`:
  # hash-elt vásárlói kulcs, enumeráció-védelem — `adatvedelem` skill),
  # amit egy mondatból nem lehet előállítani. A helyes válasz a kérdés,
  # NEM a találgatás — és semmiképp sem egy „emlékszem rá" válasz, ami a
  # rendszer részéről hazugság lenne.
  # ---------------------------------------------------------------------

  - id: korabbi_foglalas-01-ugyanoda-mint-multkor
    bemenet: "Ugyanoda, mint múltkor."
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    tilos:
      - kitalalt_datum
    megjegyzes: >
      A „múltkor" MÚLT IDEJŰ, tehát nem is dátumkérés — a dátum-kapu
      (`rule_based._mult_ido_kifejezesek_nelkul`) ezt már ma is kiszűri.
      Ami itt új: a „ugyanoda" egy olyan boltra mutat, amit a rendszer nem
      ismer. Zárt kérdés a válasz, három lehetőséggel.
    cimkek: [korabbi_foglalas, azonositas_nelkul]

  - id: korabbi_foglalas-02-multkori-megismetlese
    bemenet: "A múltkori időpontomat szeretném megismételni jövő héten."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez]
    megjegyzes: >
      Van benne használható időablak („jövő héten"), de nincs bolt — és a
      „múltkori időpontom" nem tölti ki, mert a rendszer nem tudja, ki
      beszél. A visszakérdezés az EGYETLEN nem ártó viselkedés: bármelyik
      bolt kiválasztása találgatás lenne, egy olyan vásárló nevében, akit
      nem is azonosítottunk.
    cimkek: [korabbi_foglalas, hianyzo_bolt]

  # ---------------------------------------------------------------------
  # 5. réteg — több időpont egy kérésben (2 eset)
  #
  # A v1 egy fordulóban EGY foglalást visz végig (`assistant/
  # orchestrator.py` állapotgép: keresés → jelölt → megerősítés). A „két
  # időpont egymás után" tehát nem teljesíthető egy lépésben — de a
  # keresés elindítása nem is árt: a vásárló látja, mi van, és a második
  # időpont külön fordulóban kérhető. A tiltott viselkedés a két slot
  # egyidejű lefoglalása vagy egy kitalált „páros" ajánlat.
  # ---------------------------------------------------------------------

  - id: tobb_idopont-01-kettot-egymas-utan
    bemenet: "Kellene kettő, egymás után, csütörtökön a petárdáshoz."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [szabad_idopontok, visszakerdez]
    megjegyzes: >
      A „kettő, egymás után" olyan kérés, amire a séma nem ad mezőt —
      és ez rendben van: a keresés elindul csütörtökre, a második
      időpontról a következő forduló szól. Mindkét viselkedés
      elfogadható; az lenne a hiba, ha a rendszer úgy tenne, mintha
      tudna páros időpontot foglalni.
    cimkek: [tobb_idopont, nem_tamogatott_keres]

  - id: tobb_idopont-02-nekem-es-a-felesegemnek
    bemenet: "Nekem és a feleségemnek is kellene egy-egy időpont a Szundiba pénteken."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [szabad_idopontok, visszakerdez]
    megjegyzes: >
      Ugyanaz a helyzet, más nyelvtani alakban („egy-egy"). Az `masnak`
      réteggel is rokon: itt KÉT emberről van szó, akik közül az egyik
      nincs jelen. A foglalás szempontjából ez két külön keresés, nem egy
      különleges kérés.
    cimkek: [tobb_idopont, ket_szereplo]

  # ---------------------------------------------------------------------
  # 6. réteg — udvariassági kör (2 eset)
  #
  # A beszélgetés VÉGE. Nem kérés, nem panasz, nem kérdés — a rendszernek
  # nincs mit foglalnia. A hiba, amit ez a réteg mér: a „köszönöm" szóból
  # a rendszer keresést csinál, vagy visszakérdez valamire, ami már
  # lezárult (a vásárló elköszönt).
  # ---------------------------------------------------------------------

  - id: udvariassag-01-koszonom-viszlat
    bemenet: "Köszönöm szépen, viszlát!"
    igenyel_llm: true
    varhato:
      eszkoz: nincs
    megjegyzes: >
      Ez nem foglalási kérés, tehát `nincs` — a válaszréteg dolga, hogy a
      mondat udvarias legyen. A rendszer NEM ígérhet visszahívást és nem
      kezdhet új keresést; a beszélgetést a vásárló zárta le.
    cimkek: [udvariassag, zaras]

  - id: udvariassag-02-koszonom-a-segitseget
    bemenet: "Nagyon köszönöm a segítséget, jó munkát!"
    igenyel_llm: true
    varhato:
      eszkoz: nincs
    megjegyzes: >
      A „segítség" és a „munka" szó könnyen húz a foglalási irányba (a
      bolt dolgozóiról szól), de a mondat egésze köszönet. Ellenpróba az
      01-re: ugyanaz a helyzet, más szókészlettel.
    cimkek: [udvariassag, zaras]

  # ---------------------------------------------------------------------
  # 7. réteg — meggondolás (2 eset)
  #
  # A vásárló VISSZAVONJA a kérést — nem módosítja (arra van az
  # `alkudozas` réteg), hanem eláll tőle. A helyes viselkedés: nem
  # keresünk tovább, és nem is kérdezünk vissza. A visszakérdezés itt nem
  # udvariasság, hanem nyaggatás — a vásárló épp azt mondta, hogy nem kér
  # semmit.
  # ---------------------------------------------------------------------

  - id: meggondolas-01-megsem-kell
    bemenet:
      - "Szundihoz mennék holnap."
      - "Mégsem kell, elnézést."
    igenyel_llm: true
    varhato:
      eszkoz: nincs
    tilos:
      - kitalalt_datum
    megjegyzes: >
      A második forduló TELJES visszavonás, nem módosítás — ebben tér el
      az `alkudozas-03-visszalepes` és a `mintan_tul-06-visszavonas`
      esetektől, ahol a vásárló egy KORÁBBI kéréshez tér vissza. Itt nincs
      hova visszatérni: a helyes válasz a keresés abbahagyása.
    cimkek: [meggondolas, visszavonas, tobbfordulos]

  - id: meggondolas-02-megse-akarok-foglalni
    bemenet:
      - "Törpilla, péntek délelőtt."
      - "Ja nem, várj, mégse akarok most foglalni."
    igenyel_llm: true
    varhato:
      eszkoz: nincs
    tilos:
      - kitalalt_datum
    megjegyzes: >
      Ugyanaz, beszélt nyelvi alakban („Ja nem, várj"). A hibás válasz itt
      a bolt megőrzése és egy újabb keresés indítása: a kemény rész
      továbbvitele (ADR-019) helyes szabály, de a visszavonás felülírja —
      a vásárló nem másik napot kér, hanem semmit.
    cimkek: [meggondolas, visszavonas, tobbfordulos]

  # ---------------------------------------------------------------------
  # 8. réteg — közbevetett kérdés foglalás közben (3 eset)
  #
  # A vásárló a foglalás közepén MÁSRA kérdez rá. A kérdés eldöntése két
  # dolgot kíván: (1) ez most tényválasz-kérés, nem keresés; (2) a bolt a
  # BESZÉLGETÉSBŐL jön, mert a kérdés nem ismétli meg (ADR-019: a kemény
  # rész továbbvihető). A harmadik eset ellenpróba: van olyan közbevetett
  # kérdés, amire NEM válaszolhatunk.
  # ---------------------------------------------------------------------

  - id: kozbevetes-01-meddig-tart
    bemenet:
      - "Petárdázni szeretnék csütörtökön."
      - "És meddig tart ez egyáltalán?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: ugyifogyi
        mit: idotartam
    megjegyzes: >
      Engedélyezett tényválasz, a bolt a beszélgetésből. A hibás válasz
      egy újabb keresés lenne csütörtökre: a vásárló nem időpontot kért,
      hanem egy adatot — és a keresés megismétlése azt a látszatot keltené,
      hogy meg sem hallottuk a kérdést.
    cimkek: [kozbevetes, tenyvalasz, tobbfordulos]

  - id: kozbevetes-02-hol-van-a-bolt
    bemenet:
      - "Szundihoz mennék holnap."
      - "Amúgy hol van pontosan a bolt?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: szundi
        mit: cim
    megjegyzes: >
      Ugyanaz a szerkezet, másik tényadattal. A „bolt" szó itt névmásként
      viselkedik: az előző fordulóban megnevezett boltra mutat.
    cimkek: [kozbevetes, tenyvalasz, tobbfordulos]

  - id: kozbevetes-03-mennyibe-kerul
    bemenet:
      - "Törpillához mennék pénteken."
      - "és ez mennyibe kerül?"
    igenyel_llm: true
    varhato:
      eszkoz: nincs
    tilos:
      - kitalalt_ar
    megjegyzes: >
      ELLENPRÓBA: az ár NEM engedélyezett tényválasz ezen a csatornán
      (blueprint 10., `kapuor-02`) — a `bolt_info` „mit" enumjából a
      kötött dekódolás szintjén ki van zárva. A helyes viselkedés az
      elhárítás („ezt a boltban mondják meg"), nem egy kitalált szám és
      nem is egy másik tényadat helyette.
    cimkek: [kozbevetes, hatokoron_kivul, hallucinacio_csapda, tobbfordulos]

  # ---------------------------------------------------------------------
  # 9. réteg — egyedi szóhasználat (5 eset)
  #
  # Ugyanaz a kérés, öt olyan igével, ami a mai mintakészletben nincs
  # benne („bejelentkezik", „sorszámot kér", „beugrik", „lestoppol",
  # „föliratkozik"). Ez a réteg NEM a stílust méri (arra való a szleng és
  # a tájszólás), hanem azt, hogy a szándék felismerése a MONDATON
  # múlik-e vagy egy szólistán. Ha a rendszer csak a „foglal", „időpont",
  # „mennék" szavakat ismeri, ez a réteg leleplezi.
  # ---------------------------------------------------------------------

  - id: szohasznalat-01-bejelentkeznek
    bemenet: "Bejelentkeznék a Szundihoz holnapra."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    cimkek: [szohasznalat, idegen_ige]

  - id: szohasznalat-02-sorszamot-kernek
    bemenet: "Sorszámot kérnék a petárdáshoz csütörtökre."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-20T00:00:00Z"
        datum_ig: "2026-08-20T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A „sorszám" a hivatali ügyintézés szava — a rendszerben nincs ilyen
      fogalom (nincs sorszám-kiadás, csak időpont). A kérés attól még
      pontosan az, ami: időpont a petárdáshoz csütörtökre. A szolgáltatás
      NEM tölthető ki (az Ügyifogyihoz két slug tartozik).
    cimkek: [szohasznalat, idegen_ige]

  - id: szohasznalat-03-beugranek
    bemenet: "Beugranék a Törpillához pénteken délután."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-21T00:00:00Z"
        datum_ig: "2026-08-21T17:59:59Z"
        napszak: delutan
    megjegyzes: >
      A „beugranék" a spontán, bejelentkezés nélküli látogatás szava —
      épp az ELLENTÉTE annak, amit kér. A mondatot mégis foglalásként kell
      érteni, mert az időpont meg van adva.
    cimkek: [szohasznalat, idegen_ige, napszak]

  - id: szohasznalat-04-lestoppolnek
    bemenet: "Lestoppolnék egy időpontot a Szundinál jövő hétre."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    cimkek: [szohasznalat, szleng_ige]

  - id: szohasznalat-05-foliratkoznek
    bemenet: "Föliratkoznék valamikorra az altatóshoz."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Nincs konkrét nap („valamikorra"), de van bolt — a keresésnek
      MINDENKÉPP kell ablak, és erre a rendszernek dokumentált, átlátszó
      tartaléka van (most → +7 nap, `rule_based.altalanos_ablak`). Ez nem
      kitalált dátum, hanem a hiány bevallott pótlása; a bizonyosság
      ilyenkor szándékosan `None`. A várt érték ezért PONTOSAN a tartalék
      ablak.
    cimkek: [szohasznalat, idegen_ige, tartalek_ablak]

  # ---------------------------------------------------------------------
  # 10. réteg — sürgetés (3 eset)
  #
  # A vásárló SIET, és ezt ki is mondja. A rendszernek NINCS sürgősségi
  # sávja és nincs előresorolás (ADR-017: „nincs sürgősség-becslés
  # szövegből") — a sietés tehát nem paraméter, hanem hangulat. A helyes
  # viselkedés: a keresés ugyanúgy fut, a legkorábbi időpont a válasz, és
  # semmilyen kitalált „sürgős" mező nem keletkezik.
  # ---------------------------------------------------------------------

  - id: surgosseg-01-siet
    bemenet: "Sürgős lenne, ma kellene a petárdáshoz mennem."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-17T23:59:59Z"
        napszak: barmikor
    tilos:
      - surgosseg_parameter
    megjegyzes: >
      A „sürgős" nem paraméter (ADR-017). A mondatban VAN nap („ma"),
      tehát a keresés arra megy — a sietés nem változtat rajta, és nem
      is keletkezhet belőle mező.
    cimkek: [surgosseg, nincs_surgossegi_sav]

  - id: surgosseg-02-siet-nap-nelkul
    bemenet: "Nagyon sietek, mikor tudok leghamarabb menni a Szundihoz?"
    igenyel_llm: true
    varhato:
      eszkoz: legkozelebbi_idopont
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
    tilos:
      - surgosseg_parameter
    megjegyzes: >
      A sietésre a rendszernek VAN becsületes válasza: a legkorábbi
      szabad időpont. Nem azért, mert siet, hanem mert ezt kérdezte —
      és pont ez a különbség a sürgősségi sáv és a legkorábbi időpont
      között.
    cimkek: [surgosseg, legkorabbi]

  - id: surgosseg-03-elore-sorolast-ker
    bemenet: "Nem lehetne előrevenni engem? Nagyon fontos lenne."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [nincs, visszakerdez]
    tilos:
      - surgosseg_parameter
      - kitalalt_datum
    megjegyzes: >
      ELŐRESOROLÁST kér, ami a rendszerben NEM LÉTEZIK — nincs
      prioritás, nincs várólista-átugrás. A helyes válasz az udvarias
      elhárítás vagy a kérdés (melyik boltba, mikorra), NEM egy
      hallgatólagos ígéret. A legrosszabb válasz az lenne, ha a rendszer
      úgy tenne, mintha teljesítené.
    cimkek: [surgosseg, nem_letezo_kepesseg, hatokoron_kivul]

  # ---------------------------------------------------------------------
  # 11. réteg — másik csatornára hivatkozás (2 eset)
  #
  # A vásárló olyasmire hivatkozik, ami NEM ebben a beszélgetésben
  # történt: telefonált, ott járt, üzenetet hagyott. A rendszer ezekről
  # semmit nem tud, és nem is tehet úgy, mintha tudna. A helyes válasz a
  # kérdés — a rossz az, ha a rendszer „emlékszik" valamire, ami nem
  # létezik (ez a `korabbi_foglalas` réteg rokona, de ott a SAJÁT
  # rendszerünk korábbi foglalására hivatkoztak).
  # ---------------------------------------------------------------------

  - id: mas_csatorna-01-telefonalt
    bemenet: "Tegnap telefonon már megbeszéltem valakivel, csak megerősíteném."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez, nincs]
    tilos:
      - kitalalt_datum
    megjegyzes: >
      A rendszer NEM tud a telefonos beszélgetésről — se megerősíteni,
      se cáfolni nem tudja. A helyes viselkedés a kérdés (melyik boltba,
      mikorra), a rossz pedig bármilyen „igen, látom" típusú válasz: az
      hazugság lenne a rendszer részéről.
    cimkek: [mas_csatorna, nem_ismert_elozmeny]

  - id: mas_csatorna-02-uzenetet-hagyott
    bemenet: "Hagytam üzenetet a Törpillánál, arra szeretnék visszatérni."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez, nincs, szabad_idopontok]
    megjegyzes: >
      Ugyanaz, MEGNEVEZETT bolttal — ettől a keresés is elfogadható
      viselkedés lesz (a bolt megvan, a szándék foglalás). Amit
      továbbra sem tehet a rendszer: úgy tenni, mintha ismerné az
      üzenetet.
    cimkek: [mas_csatorna, nem_ismert_elozmeny]

  # ---------------------------------------------------------------------
  # 12. réteg — AZ ELSŐ ÉLES PRÓBÁBÓL (3 eset)
  #
  # Ezek nem kitalált mondatok: egy valódi, kézi próba naplójából
  # származnak (`naplo/probak.jsonl`, 2026-09-05), és a golden-set skill
  # hurkának a második fele („valós beszélgetésben hiba → redaktált
  # trace → annotálás → golden set").
  #
  # **A várt választ EMBER írta be, nem a napló.** Ez fontos: a naplóban
  # az áll, amit a rendszer AKKOR adott — és a `jelolt_valasztas` esetben
  # az rossz volt. A helyes válasz eldöntése után lett belőle teszteset.
  # ---------------------------------------------------------------------

  - id: elesbol-01-a-nyolc-tizenotos
    bemenet:
      - "törpilla mégis. A legkorábbi időpontot"
      - "a nyolc tizenötös"
    felajanlott:
      - "1. 2026-12-21 08:00–08:20"
      - "2. 2026-12-21 08:00–08:15"
      - "3. 2026-12-21 08:15–08:30"
    igenyel_llm: true
    varhato:
      eszkoz: jelolt_valasztas
      parameterek:
        sorszam: 3
    megjegyzes: >
      KIMONDOTT IDŐPONTRA hivatkozás, a felajánlott listából — az első
      valós példa erre. A „nyolc tizenötös" a 8:15-kor KEZDŐDŐ időpont,
      vagyis a harmadik: az emberek a kezdés szerint azonosítanak egy
      időpontot, és a rendszer saját mondata is így ajánlotta („a
      legkorábbi nyolc órakor, de van nyolc tizenötkor is").

      **Az éles próbában a rendszer a MÁSODIKAT választotta** (08:00–08:15,
      ami 8:15-kor VÉGZŐDIK), és arra kért megerősítést. Ez pontosan az a
      hibafajta, amiről a sorszám-modul docstringje beszél: nem
      visszakérdezés lesz belőle, hanem MÁS IDŐPONT lefoglalása.

      **AZ ÓRÁK EGGYEL NAGYOBBAK, MINT A NAPLÓBAN** (ADR-033): a próba
      idején a felület a tárolt UTC-t mutatta, tehát a barátunk „a hét
      tizenötös"-t mondta arra, amit ma 8:15-ként lát. A mondat szerkezete
      — ez az, amit az eset mér — betűre ugyanaz; ha az órákat hagynánk
      a régi alakban, olyan képernyőre hivatkozna az eset, ami már nem
      létezik.
    cimkek: [elesbol, jelolt_hivatkozas, kimondott_idopont, tobbfordulos]

  - id: elesbol-02-meta-kerdes
    bemenet: "csak a választ beszéled?"
    varhato:
      eszkoz: meta_valasz
      kapuor_dontes: meta_kerdes
    reszleges_elfogadas:
      eszkoz: nincs
      pontszam: 0.5
    megjegyzes: >
      A RENDSZERRŐL szóló kérdés, foglalás közben. Az éles próbában
      KERESÉS lett belőle: a rendszer újra felajánlotta ugyanazt a három
      időpontot egy olyan kérdésre, aminek semmi köze a foglaláshoz.
      A kapuőr negyedik kategóriája (`META_KERDES`) ezt fogja meg, a
      modell előtt.

      **A `nincs` fél pont**: az is helyes annyiban, hogy nem indít
      keresést és nem talál ki semmit — csak nem válaszol arra, amit a
      vásárló kérdezett. A teljes pont a `meta_valasz`, mert arra VAN
      mondatunk.

      **A determinisztikus alapvonalon (`--ertelmezo szabaly`) ez az eset
      BUKIK**, és ez így helyes: a kapuőr a KASZKÁDBAN fut, a csupasz
      szabály-réteg nem ismeri. Éles úton (`forditott`) modell nélkül is
      megvan — a kapuőr a modellhívás előtt dönt.
    cimkek: [elesbol, meta_kerdes]

  - id: elesbol-03-valassz-te
    bemenet:
      - "törpilla mégis. A legkorábbi időpontot"
      - "nekem mind jó. válassz te."
    felajanlott:
      - "1. 2026-12-21 08:00–08:20"
      - "2. 2026-12-21 08:00–08:15"
      - "3. 2026-12-21 08:15–08:30"
    igenyel_llm: true
    varhato:
      eszkoz: dontsd_el_te
      parameterek: {}
    megjegyzes: >
      A vásárló ÁTADJA a döntést. Az éles próbában a rendszer újra
      felajánlotta ugyanazt a három időpontot — visszaadta a döntést
      annak, aki épp lemondott róla. A helyes viselkedés: a pontozó
      ELSŐ jelöltje (a jelöltek már abban a sorrendben állnak, ADR-006),
      és megerősítés-kérés, kimondott időponttal. A paraméterlista
      üres: nincs mit megadni, a választást az orchestrator hajtja
      végre.
    cimkek: [elesbol, dontes_atadasa, tobbfordulos]

  # ---------------------------------------------------------------------
  # 13. réteg — ELSŐ TALÁLKOZÁS (8 eset)
  #
  # Olyan mondatok, amiket egy a rendszert NEM ISMERŐ ember mond. A négy
  # első eset SZÓ SZERINT az első idegen próbából való
  # (`naplo/probak.jsonl`, 2026-09-05) — a többi ugyanennek a
  # beszédhelyzetnek a rokona.
  #
  # **A várt válasz az, aminek történnie KELLETT VOLNA**, nem az, ami
  # történt. Ami történt: négy forduló alatt jutott el a köszönéstől
  # odáig, hogy „menjen be a boltba élőben" — úgy, hogy a rendszer
  # egyetlen keresést sem futtatott.
  #
  # A `koszones` és a `kinalat` a kapuőr döntése (ADR-032), tehát ezek
  # az esetek MODELL NÉLKÜL is mennek — de csak a KASZKÁDON
  # (`--ertelmezo forditott`), mert a kapuőr ott fut. A csupasz
  # szabály-alapú alapvonalon (`--ertelmezo szabaly`) buknak, és ez így
  # helyes: az a réteg nem ismeri a kapuőrt. Ami számít: az ÉLES úton
  # akkor is megvannak, ha nem fut az Ollama.
  # ---------------------------------------------------------------------

  - id: elso_talalkozas-01-hello
    bemenet: "helló."
    varhato:
      eszkoz: koszones
    megjegyzes: >
      AZ ELSŐ IDEGEN PRÓBA 1. FORDULÓJA. Ami történt: „Ehhez még kellene
      tudnom: melyik boltba szeretnél menni." — a rendszer feltételezte,
      hogy a vásárló ismeri a boltokat. A helyes válasz: köszönés,
      rövid bemutatkozás, és MI VAN ITT — a boltok az adatbázisból,
      leírással.
    cimkek: [elso_talalkozas, koszones]

  - id: elso_talalkozas-02-milyenek-vannak
    bemenet: "milyenek vannak?"
    varhato:
      eszkoz: kinalat
    megjegyzes: >
      A 2. FORDULÓ. Ami történt: az ismétlés-figyelő kiutat ajánlott
      („Úgy látom, így nem jutunk előre"), mert a mondat megint nem
      tartalmazott boltnevet. Pedig ez a legpontosabb kérdés, amit egy
      rendszert nem ismerő ember feltehet — és pontosan erre kellett
      volna felsorolni a kínálatot.
    cimkek: [elso_talalkozas, kinalat]

  - id: elso_talalkozas-03-masik-napszakot
    bemenet:
      - "helló."
      - "milyenek vannak?"
      - "másik napszakot."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez, kinalat, szabad_idopontok]
    tilos:
      - kitalalt_datum
      - kitalalt_bolt
    megjegyzes: >
      A 3. FORDULÓ, és a legnehezebb. A vásárló a KIÚT gombjai közül
      választott („másik napszakot") — olyan felajánlásra válaszolt,
      aminek nem volt értelme, mert keresés még nem is futott.

      A javítás (ADR-032) után ez a mondat már nem hangozhat el
      ugyanígy: a 2. fordulóra katalógus jön, nem kiút. Az eset mégis
      benne marad, mert a mondat ATTÓL MÉG elhangozhat — és akkor a
      helyes viselkedés a kérdés vagy a felsorolás, NEM egy kitalált
      keresés valamelyik boltban. Ezért mér elfogadható viselkedéseket:
      itt nincs egy helyes válasz, csak ártó és nem ártó.
    cimkek: [elso_talalkozas, kiut_utan, tobbfordulos]

  - id: elso_talalkozas-04-mindenkepp-itt
    bemenet:
      - "milyenek vannak?"
      - "de én mindenképp itt akarom."
    igenyel_llm: true
    varhato:
      elfogadhato_eszkozok: [visszakerdez, kinalat]
    tilos:
      - kitalalt_bolt
    megjegyzes: >
      A 4. FORDULÓ. Ami történt: MÁSODSZOR is az „menjen be a boltba
      élőben" mondat — arra, hogy a vásárló kimondottan ITT akarja
      intézni. Ez a legrosszabb pillanatban adott elutasítás: a
      ragaszkodás jele annak, hogy AKAR foglalni.

      A helyes viselkedés: nem elküldeni, hanem megmutatni, mi közül
      választhat, vagy megkérdezni, melyik bolt érdekli. Az „emberhez
      irányítás" itt hibás — de nem azért, mert soha nem szabad, hanem
      mert még semmit nem próbáltunk.
    cimkek: [elso_talalkozas, kiut_utan, tobbfordulos]

  - id: elso_talalkozas-05-mit-tudtok-csinalni
    bemenet: "mit lehet itt csinálni?"
    varhato:
      eszkoz: kinalat
    megjegyzes: >
      Ugyanaz a kérdés, más megfogalmazásban. Azért kell, hogy a
      felismerés ne egyetlen mondatra álljon be.
    cimkek: [elso_talalkozas, kinalat]

  - id: elso_talalkozas-06-jo-napot-onmagaban
    bemenet: "Jó napot kívánok!"
    varhato:
      eszkoz: koszones
    megjegyzes: >
      Magázó köszönés, önmagában. A `koszones` kategória feltétele, hogy
      a mondat EGÉSZE köszönés legyen — l. a következő ellenpróbát.
    cimkek: [elso_talalkozas, koszones]

  - id: elso_talalkozas-07-ellenproba-koszones-plusz-keres
    bemenet: "Jó napot! Szeretnék időpontot a Szundiba holnapra."
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      ELLENPRÓBA: a köszönés itt BEVEZETÉS, és a kérés viszi a fordulót.
      Ha a kapuőr köszönésnek venné, a rendszer bemutatkozna egy olyan
      vásárlónak, aki már megmondta, mit akar — az udvariasság
      ilyenkor időhúzás.
    cimkek: [elso_talalkozas, ellenproba]

  - id: elso_talalkozas-08-ellenproba-megnevezett-bolt
    bemenet: "Mit lehet kapni a Törpillánál?"
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: torpilla
        mit: termek
    megjegyzes: >
