  - id: toredekes-10-irasjel-nelkul
    bemenet: "jó napot szeretnék időpontot a szundihoz holnapra köszönöm"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      ÍRÁSJEL NÉLKÜLI folyam, kisbetűvel, udvariassági kerettel az
      elején és a végén. A tartalom teljes — csak a tagolás hiányzik.
    cimkek: [toredekes, irasjel_nelkul]

  - id: toredekes-11-csak-a-nap
    bemenet:
      - "Petárdázni szeretnék."
      - "csütörtök"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-20T00:00:00Z"
        datum_ig: "2026-08-20T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
