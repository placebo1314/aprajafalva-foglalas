  - id: toredekes-08-javitgatas-menet-kozben
    bemenet: "Kedden… nem, mégis inkább szerdán, a petárdáshoz"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-19T00:00:00Z"
        datum_ig: "2026-08-19T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      JAVÍTGATÁS egy mondaton belül: a „kedden" ELVETVE, a „szerdán" az
      érvényes. Ez nem többfordulós visszavonás — egyetlen mondatban
      történik, és a mintaillesztés a hun-date-parser ELSŐ találatát
      venné (keddet).
    cimkek: [toredekes, javitgatas]

  - id: toredekes-09-egyszavas-valasz
    bemenet:
      - "Szeretnék időpontot."
      - "torpilla"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      EGYSZAVAS válasz egy zárt kérdésre: az első forduló
