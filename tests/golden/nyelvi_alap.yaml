    cimkek: [toredekes, ismetles]

  - id: toredekes-13-kerdojel-nelkuli-kerdes
    bemenet: "van hely ma a törpillánál"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-17T23:59:59Z"
        napszak: barmikor
