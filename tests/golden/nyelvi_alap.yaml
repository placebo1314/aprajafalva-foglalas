# A golden set nyelvi magja — kézzel írt esetek, rétegekbe sorolva.
#
# Ez NEM a modell kimenetéből készült: előbb dőlt el, mi a helyes válasz,
# és csak utána mérünk (golden-set skill: "Ne a modell kimenetéből írj
# tesztesetet").
#
# A rétegek külön küszöböt kapnak. A leggyengébb réteg a mérőszám, nem az
# átlag — egy 98%-os összesítés mögött állhat 70% az idős törpökön, és pont
# ők nem tudnak mást választani (blueprint 7. szakasz).
#
# FONTOS: a `varhato.eszkoz: visszakerdez` NEM kudarc. Ha a mondatból
# hiányzik egy kritikus mező (dátum, bolt, szolgáltatás), a HELYES viselkedés
# a visszakérdezés — és két sikertelen értelmezés után zárt kérdésre váltás.
# Ha egy modell ilyenkor "kitalál" egy dátumot, az rosszabb, mintha kérdezne.
#
# A `most` mező minden relatív dátumot tartalmazó esetnél kötelező:
# 2026-08-17 = hétfő. Enélkül a teszt egy hét múlva megbukna.
#
# A szolgáltatás- és boltazonosítóknak egyezniük kell a seed/betolt.py
# értékeivel.

# BŐVÍTÉS 2026-09-12: a halmaz 55 → 85 esetre nőtt. A három leggyengébb
# réteg kapott tíz-tíz új esetet (elengedés 5→15, tájszólás 4→14,
# töredékes 4→14), MÁS beszédhelyzetekből — nem a meglévők
# átfogalmazásaiból.
#
# **Miért a méret, és nem az esetek nehézsége.** A mérés futásról
# futásra 1-2 esetnyit ingadozik (`temperature: 0` mellett is), és öt
# eses rétegnél egyetlen billenő eset 20 százalékpont — a réteg száma
# ilyenkor többet mond a szerencséről, mint a rendszerről. Tizenöt
# esetnél ugyanez 6,7 pont. A bővítés célja tehát az, hogy a rétegek
# száma STABIL legyen, nem az, hogy alacsonyabb.

meta:
  verzio: 1
  most_alapertelmezett: "2026-08-17T09:00:00Z"   # hétfő
  kuszobok:
    koznyelvi: 0.98
    tajszolas: 0.90
    toredekes: 0.90
    szleng: 0.92
    egyszerusitett: 0.90
    alkudozas: 0.90
    # Az elengedés-réteg a KASZKÁD képességét méri (a kemény rész
    # elvetése) — a determinisztikus alapvonalon várhatóan 0%, ezért az
    # `igenyel_llm: true` jelölés (l. a réteg fejlécét lent).
    elengedes: 0.90
    valtozatossag: 0.90
    # Mintaillesztésen túl — l. a réteg fejlécét a fájl végén.
    mintan_tul: 0.90
    # „Mindegy" mint ÉRTÉK, nem hiány (ADR-024) — l. a réteg fejlécét.
    mindegy: 0.90

esetek:

  # ---------------------------------------------------------------------
  # 1. réteg — köznyelvi (5 eset)
  # ---------------------------------------------------------------------

  - id: koznyelvi-01
    bemenet: "Szeretnék időpontot foglalni jövő hét keddre nagy petárdához."
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        szolgaltatas_id: nagy_petarda
        datum_tol: "2026-08-25T00:00:00Z"
        datum_ig: "2026-08-25T23:59:59Z"
        napszak: barmikor
    cimkek: [koznyelvi, relativ_datum, szolgaltatas_azonositas]

  - id: koznyelvi-02
    bemenet: "Mikor tudok legkorábban menni Törpillához?"
    varhato:
      eszkoz: legkozelebbi_idopont
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
    megjegyzes: >
      **Ez az eset megváltozott** (2026-08-23): korábban `szabad_idopontok`-ot
      várt egy nyitott (mától +7 nap) ablakkal. A "mikor tudok legkorábban
      menni?" azonban nem időszak-kérdés — egyetlen objektív helyes válasza
      van, a legkorábbi szabad időpont —, és erre azóta saját eszköz van
      (`assistant/tools/legkozelebbi_idopont.py`). Dátumablak szándékosan
      nincs a paraméterek közt: a kérdésben sincs. A boltnak egy
      szolgáltatása van, ezért az egyértelmű (blueprint 3. szakasz).
      A tág ablakos keresés nem hibás válasz, csak gyengébb (a vásárlónak
      három jelöltből kell kiválasztania azt, amit kérdezett) — ezért kap
      fél pontot.
    reszleges_elfogadas:
      eszkoz: szabad_idopontok
      pontszam: 0.5
    cimkek: [koznyelvi, legkorabbi_kerdes]

  - id: koznyelvi-03
    bemenet: "Meddig van nyitva a Szundi bolt szombaton?"
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: szundi
        mit: nyitvatartas
        datum: "2026-08-22"
    megjegyzes: >
      Engedélyezett tényválasz, azonosítás nélkül. Nem szabad foglalási ágra
      terelni (törpök 4. igénye: ne faggassák feleslegesen).
    cimkek: [koznyelvi, tenyvalasz, azonositas_nelkul]

  - id: koznyelvi-04
    bemenet: "Le szeretném mondani a foglalásomat, a kód X7K2M9QP."
    varhato:
      eszkoz: foglalas_lemondas
      parameterek:
        foglalasi_kod: "X7K2M9QP"
    cimkek: [koznyelvi, lemondas, foglalasi_kod]

  - id: koznyelvi-05
    bemenet: "Át tudnám tenni szerdára a péntek délelőtti időpontomat?"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: foglalasi_kod
      varhato_kerdes_tipusa: nyitott
    megjegyzes: >
      Az áthelyezés atomi művelet, de foglalási kód nélkül nem azonosítható,
      melyik foglalásról van szó. A "szerda" feloldása (2026-08-19) helyes,
      de önmagában nem elég a művelethez.
    cimkek: [koznyelvi, athelyezes, hianyzo_adat]

  # ---------------------------------------------------------------------
  # 2. réteg — tájszólás, régies (4 eset)
  # ---------------------------------------------------------------------

  - id: tajszolas-01
    bemenet: "Möggyek-ë hónap délelőtt a petárdáshó?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      Három nehézség egyszerre: ö-ző alak ("möggyek"), a "hónap" itt HOLNAP
      jelentésű (nem hónap!), és a bolt körülírása ("petárdás"). A "hónap"
      a normalizáló szótár egyik legfontosabb bejegyzése lesz — köznyelvi
      olvasata teljesen mást jelentene.
    cimkek: [tajszolas, csapda_szo, bolt_korulras]

  - id: tajszolas-02
    bemenet: "Kéretnék egy időpontot szombat reggelre, ha lehetséges vóna."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      A dátum egyértelmű (2026-08-22), a bolt nem. Régies alakok: "kéretnék",
      "vóna". Zárt kérdés a helyes forma — három bolt, felsorolható.
    cimkek: [tajszolas, regies, zart_kerdes]

  - id: tajszolas-03
    bemenet: "Hun van az az üzlet, ahun a boldogságot árullyák?"
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: torpilla
        mit: cim
    megjegyzes: >
      Nem foglalási szándék, hanem tényválasz. A kapuőrnek fel kell ismernie,
      hogy ez engedélyezett kérdés, nem "nem értem" ág.
    cimkek: [tajszolas, tenyvalasz, hol_kerdes]

  - id: tajszolas-04
    bemenet: "Píntökön délután érnék rá, akkor van-e hely?"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      "Píntök" = péntek (2026-08-21), a napszak egyértelmű. A bolt hiányzik.
      Fontos, hogy a rendszer a MEGLÉVŐ adatot megtartsa, és csak a hiányzót
      kérdezze — a törpök 6. igénye (javítás, ne újrakezdés).
    cimkek: [tajszolas, reszleges_adat]

  # ---------------------------------------------------------------------
  # 3. réteg — elharapott, töredékes (4 eset)
  # ---------------------------------------------------------------------

  - id: toredekes-01
    bemenet: "kedden… petárda… lehet?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Táviratstílus, de minden kritikus mező kikövetkeztethető. A "kedd"
      a legközelebbi kedd (holnap). Ha a modell itt visszakérdez, az NEM
      hiba, csak gyengébb élmény — a golden set részleges pontot ad rá.
    reszleges_elfogadas:
      eszkoz: visszakerdez
      pontszam: 0.5
    cimkek: [toredekes, tavirat_stilus]

  - id: toredekes-02
    bemenet: "hát én csak azt szeretném hogy hogy mikor lehet menni"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      Szándék felismerhető (foglalás), de SEMMI konkrétum nincs benne.
      A helyes válasz zárt kérdés — nyitott kérdésre ("Mikor szeretne
      menni?") a beszélő valószínűleg ugyanilyen bizonytalanul válaszolna.
    cimkek: [toredekes, ismetles, nulla_konkretum]

  - id: toredekes-03
    bemenet: "időpont. holnap. délelőtt."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      A `megorzott_parameterek` a lényeg: a visszakérdezés után a dátumot
      NEM szabad újra megkérdezni. Ez a leggyakoribb hibaforrás — a
      részleges szándék elvesztése.
    cimkek: [toredekes, szandek_megorzes]

  - id: toredekes-04
    bemenet: "Szeretnék… izé… hogy is mondjam… bemenni a boltba valamikor a héten."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
    megjegyzes: >
      A töltelékszavak ("izé", "hogy is mondjam") nem hordoznak jelentést,
      de nem is szabad elakadni rajtuk. "A héten" = mától vasárnapig.
    cimkek: [toredekes, toltelekszo]

  # ---------------------------------------------------------------------
  # TÁJSZÓLÁS — bővítés (2026-09-12). Tíz új eset, MÁS beszédhelyzetből.
  #
  # Nem a meglévő négy átfogalmazásai: itt a nyelvjárási alak MÁS
  # helyzetben jelenik meg (kísérő, panasz, alkudozás, ténykérdés,
  # lemondás), és más nyelvjárási jelenségeket használ — í-zés
  # („kík", „níz"), ö-zés („mögyök", „köll"), régies szóhasználat
  # („dílelőtt", „napszámra"), és a „hun/hunnan" kérdőszavak.
  #
  # A determinisztikus normalizáló (`assistant/interpreter/
  # normalizalo.py`) egy részüket ismeri; ami nincs a szótárában, azt a
  # modellnek kell értenie — épp ezért ér valamit a réteg.
  # ---------------------------------------------------------------------

  - id: tajszolas-05-mogyok-a-torpillaho
    bemenet: "Csütörtökön mögyök a Törpilláho, ha lehetne."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-20T00:00:00Z"
        datum_ig: "2026-08-20T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Ö-ZÉS („mögyök") és rövidült helyhatározó („Törpilláho"). A kérés
      egyébként teljesen szokásos — a nehézség kizárólag a hangalak.
    cimkek: [tajszolas, o_zes]

  - id: tajszolas-06-koll-a-nagy-petarda
    bemenet: "Kőne egy nagy petárda szombaton dílelőtt."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        szolgaltatas_id: nagy_petarda
        datum_tol: "2026-08-22T00:00:00Z"
        datum_ig: "2026-08-22T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      A „kőne" (kellene) és a „dílelőtt" (délelőtt) együtt: az í-zés a
      napszakot is érinti, tehát nem elég a bolt felismerése — a napszak
      is a nyelvjárási alakból jön.
    cimkek: [tajszolas, i_zes, napszak]

  - id: tajszolas-07-hun-van-az-uzlet
    bemenet: "Hun van az altatós bót?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: szundi
        mit: cim
    megjegyzes: >
      TÉNYKÉRDÉS nyelvjárási alakban: „hun" (hol) és „bót" (bolt). A
      helyes válasz a cím — nem foglalás. Ez a réteg eddig csak
      foglalási kéréseket tartalmazott; a tényválasz-ág legalább annyira
      érintett a hangalakoktól.
    cimkek: [tajszolas, tenyvalasz, azonositas_nelkul]

  - id: tajszolas-08-mikor-nyitnak-ki
    bemenet: "Oszt mikor nyitnak ki a petárdásék?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: ugyifogyi
        mit: nyitvatartas
    megjegyzes: >
      Az „oszt" (aztán) mondatkezdő töltelék, a „petárdásék" pedig
      népies többes-birtokos alak a boltra. A kérdés nyitvatartásra
      vonatkozik.
    cimkek: [tajszolas, tenyvalasz, toltelekszo]

  - id: tajszolas-09-lemondanam-a-kodot
    bemenet: "Lemondanám aztat az idõpontot, a kód B4T7R2WQ."
    varhato:
      eszkoz: foglalas_lemondas
      parameterek:
        foglalasi_kod: "B4T7R2WQ"
    megjegyzes: >
      LEMONDÁS nyelvjárási alakban: „aztat" (azt) és ékezet nélküli
      „idõpontot" (a magyar billentyűzet leggyakoribb elgépelése).
      A foglalási kód a mondatból jön, tehát a determinisztikus réteg is
      megoldja — a réteg attól nem lesz értéktelen: a lemondás a
      leggyakoribb, ahol elgépelés is jön a nyelvjárás mellé.
    cimkek: [tajszolas, lemondas, foglalasi_kod]

  - id: tajszolas-10-mikor-ernek-ra
    bemenet: "Mikor érnek rá maguk a jövõ hétön a boldogságosnál?"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A kérdés a RENDSZER felől van megfogalmazva („mikor érnek rá
      maguk"), nem a vásárló felől — miközben ugyanaz a kérés. Az
      ö-zés a dátumot érinti („hétön"), és a boltot körülírás azonosítja
      („boldogságosnál").
    cimkek: [tajszolas, o_zes, korulirt_bolt]

  - id: tajszolas-11-nizzik-mar-meg
    bemenet: "Nízzék mán meg, van-e hely holnap a Szundinál."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Í-ZÉS felszólító módban („nízzék"), és a „mán" (már) töltelék.
      Udvariassági többes szám — a rendszert magázza.
    cimkek: [tajszolas, i_zes, felszolito]

  - id: tajszolas-12-ha-mar-arra-jarok
    bemenet: "Ha mán arra járok, beníznék az ügyifogyisokhó pénteken."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-21T00:00:00Z"
        datum_ig: "2026-08-21T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Feltételes bevezetés („ha mán arra járok") + í-zés („beníznék") +
      rövidült helyhatározó („ügyifogyisokhó"). A szolgáltatás NEM
      tölthető ki: az Ügyifogyihoz két méret tartozik.
    cimkek: [tajszolas, i_zes, toltelekszo]

  - id: tajszolas-13-elkelne-egy-kis-alvas
    bemenet: "Elkéne mán egy kis alvás, szerda este ha van hely."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-19T00:00:00Z"
        datum_ig: "2026-08-19T22:59:59Z"
        napszak: este
    megjegyzes: >
      A boltot nem néven, hanem a KÍVÁNSÁGGAL azonosítja („elkéne egy
      kis alvás" → altató → Szundi), nyelvjárási alakban („elkéne",
      „mán"). A napszak („este") a mondatból jön, és az ablakot is
      szűkíti.
    cimkek: [tajszolas, korulirt_bolt, napszak]

  - id: tajszolas-14-ellenproba-koznyelvi
    bemenet: "Kedden délelőtt szeretnék menni a Szundiba."
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      ELLENPRÓBA: ugyanaz a kérés TISZTA köznyelven. Ha egy jövőbeli
      normalizáló túl agresszívan „javítana" (pl. minden „í"-t „é"-vé),
      ez az eset marad a horgony, hogy a köznyelvi alak sem sérülhet.
    cimkek: [tajszolas, ellenproba]

  # ---------------------------------------------------------------------
  # TÖREDÉKES — bővítés (2026-09-12). Tíz új eset, MÁS beszédhelyzetből.
  #
  # A töredékesség itt nem egyféle: (a) TÁVIRATSTÍLUS (csak kulcsszavak),
  # (b) FÉLBEHAGYOTT mondat, (c) JAVÍTGATÁS menet közben („nem, mégis"),
  # (d) EGYSZAVAS válasz egy előző fordulóra, (e) ÍRÁSJEL nélküli
  # folyam. Mindegyik valódi gépelési/beszéd-alakzat, nem stilizált zaj —
  # a robusztussági halmaz méri a zajt, ez a réteg a HIÁNYOS, de
  # értelmezhető mondatot.
  # ---------------------------------------------------------------------

  - id: toredekes-05-tavirat-harom-szo
    bemenet: "szundi holnap este"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T22:59:59Z"
        napszak: este
    megjegyzes: >
      TÁVIRATSTÍLUS, három szó, nulla mondattan — bolt, nap, napszak.
      Igét nem tartalmaz, tehát a „foglalási szándék" nem szóból, hanem
      a HELYZETBŐL következik.
    cimkek: [toredekes, tavirat]

  - id: toredekes-06-tavirat-ket-szo
    bemenet: "petárda pénteken?"
    varhato:
