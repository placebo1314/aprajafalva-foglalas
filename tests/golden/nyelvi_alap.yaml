        bolt_id: ugyifogyi
        datum_tol: "2026-08-21T00:00:00Z"
        datum_ig: "2026-08-21T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Két szó és egy kérdőjel. A méret nem tölthető ki (két slug
      tartozik a bolthoz), a nap viszont igen.
    cimkek: [toredekes, tavirat]

  - id: toredekes-07-felbehagyott-mondat
    bemenet: "Szeretnék egy időpontot a Törpi… szóval hát"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      FÉLBEHAGYOTT mondat: a bolt neve is csonka („Törpi"), és a
      folytatás töltelékbe fullad. A bolt így is azonosítható, a nap
      viszont nincs — az általános ablak a helyes, nem a visszakérdezés:
