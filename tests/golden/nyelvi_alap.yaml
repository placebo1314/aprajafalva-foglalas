# A golden set nyelvi magja — kézzel írt esetek, rétegekbe sorolva.
#
# Ez NEM a modell kimenetéből készült: előbb dőlt el, mi a helyes válasz,
# és csak utána mérünk (golden-set skill: "Ne a modell kimenetéből írj
# tesztesetet").
#
# A rétegek külön küszöböt kapnak. A leggyengébb réteg a mérőszám, nem az
# átlag — egy 98%-os összesítés mögött állhat 70% az idős törpökön, és pont
# ők nem tudnak mást választani (blueprint 7. szakasz).
#
# FONTOS: a `varhato.eszkoz: visszakerdez` NEM kudarc. Ha a mondatból
# hiányzik egy kritikus mező (dátum, bolt, szolgáltatás), a HELYES viselkedés
# a visszakérdezés — és két sikertelen értelmezés után zárt kérdésre váltás.
# Ha egy modell ilyenkor "kitalál" egy dátumot, az rosszabb, mintha kérdezne.
#
# A `most` mező minden relatív dátumot tartalmazó esetnél kötelező:
# 2026-08-17 = hétfő. Enélkül a teszt egy hét múlva megbukna.
#
# A szolgáltatás- és boltazonosítóknak egyezniük kell a seed/betolt.py
# értékeivel.

meta:
  verzio: 1
  most_alapertelmezett: "2026-08-17T09:00:00Z"   # hétfő
  kuszobok:
    koznyelvi: 0.98
    tajszolas: 0.90
    toredekes: 0.90
    szleng: 0.92
    egyszerusitett: 0.90
    alkudozas: 0.90
    # Az elengedés-réteg a KASZKÁD képességét méri (a kemény rész
    # elvetése) — a determinisztikus alapvonalon várhatóan 0%, ezért az
    # `igenyel_llm: true` jelölés (l. a réteg fejlécét lent).
    elengedes: 0.90
    valtozatossag: 0.90
    # Mintaillesztésen túl — l. a réteg fejlécét a fájl végén.
    mintan_tul: 0.90
    # „Mindegy" mint ÉRTÉK, nem hiány (ADR-024) — l. a réteg fejlécét.
    mindegy: 0.90

esetek:

  # ---------------------------------------------------------------------
  # 1. réteg — köznyelvi (5 eset)
  # ---------------------------------------------------------------------

  - id: koznyelvi-01
    bemenet: "Szeretnék időpontot foglalni jövő hét keddre nagy petárdához."
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        szolgaltatas_id: nagy_petarda
        datum_tol: "2026-08-25T00:00:00Z"
        datum_ig: "2026-08-25T23:59:59Z"
        napszak: barmikor
    cimkek: [koznyelvi, relativ_datum, szolgaltatas_azonositas]

  - id: koznyelvi-02
    bemenet: "Mikor tudok legkorábban menni Törpillához?"
    varhato:
      eszkoz: legkozelebbi_idopont
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
    megjegyzes: >
      **Ez az eset megváltozott** (2026-08-23): korábban `szabad_idopontok`-ot
      várt egy nyitott (mától +7 nap) ablakkal. A "mikor tudok legkorábban
      menni?" azonban nem időszak-kérdés — egyetlen objektív helyes válasza
      van, a legkorábbi szabad időpont —, és erre azóta saját eszköz van
      (`assistant/tools/legkozelebbi_idopont.py`). Dátumablak szándékosan
      nincs a paraméterek közt: a kérdésben sincs. A boltnak egy
      szolgáltatása van, ezért az egyértelmű (blueprint 3. szakasz).
      A tág ablakos keresés nem hibás válasz, csak gyengébb (a vásárlónak
      három jelöltből kell kiválasztania azt, amit kérdezett) — ezért kap
      fél pontot.
    reszleges_elfogadas:
      eszkoz: szabad_idopontok
      pontszam: 0.5
    cimkek: [koznyelvi, legkorabbi_kerdes]

  - id: koznyelvi-03
    bemenet: "Meddig van nyitva a Szundi bolt szombaton?"
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: szundi
        mit: nyitvatartas
        datum: "2026-08-22"
    megjegyzes: >
      Engedélyezett tényválasz, azonosítás nélkül. Nem szabad foglalási ágra
      terelni (törpök 4. igénye: ne faggassák feleslegesen).
    cimkek: [koznyelvi, tenyvalasz, azonositas_nelkul]

  - id: koznyelvi-04
    bemenet: "Le szeretném mondani a foglalásomat, a kód X7K2M9QP."
    varhato:
      eszkoz: foglalas_lemondas
      parameterek:
        foglalasi_kod: "X7K2M9QP"
    cimkek: [koznyelvi, lemondas, foglalasi_kod]

  - id: koznyelvi-05
    bemenet: "Át tudnám tenni szerdára a péntek délelőtti időpontomat?"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: foglalasi_kod
      varhato_kerdes_tipusa: nyitott
    megjegyzes: >
      Az áthelyezés atomi művelet, de foglalási kód nélkül nem azonosítható,
      melyik foglalásról van szó. A "szerda" feloldása (2026-08-19) helyes,
      de önmagában nem elég a művelethez.
    cimkek: [koznyelvi, athelyezes, hianyzo_adat]

  # ---------------------------------------------------------------------
  # 2. réteg — tájszólás, régies (4 eset)
  # ---------------------------------------------------------------------

  - id: tajszolas-01
    bemenet: "Möggyek-ë hónap délelőtt a petárdáshó?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      Három nehézség egyszerre: ö-ző alak ("möggyek"), a "hónap" itt HOLNAP
      jelentésű (nem hónap!), és a bolt körülírása ("petárdás"). A "hónap"
      a normalizáló szótár egyik legfontosabb bejegyzése lesz — köznyelvi
      olvasata teljesen mást jelentene.
    cimkek: [tajszolas, csapda_szo, bolt_korulras]

  - id: tajszolas-02
    bemenet: "Kéretnék egy időpontot szombat reggelre, ha lehetséges vóna."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      A dátum egyértelmű (2026-08-22), a bolt nem. Régies alakok: "kéretnék",
      "vóna". Zárt kérdés a helyes forma — három bolt, felsorolható.
    cimkek: [tajszolas, regies, zart_kerdes]

  - id: tajszolas-03
    bemenet: "Hun van az az üzlet, ahun a boldogságot árullyák?"
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: torpilla
        mit: cim
    megjegyzes: >
      Nem foglalási szándék, hanem tényválasz. A kapuőrnek fel kell ismernie,
      hogy ez engedélyezett kérdés, nem "nem értem" ág.
    cimkek: [tajszolas, tenyvalasz, hol_kerdes]

  - id: tajszolas-04
    bemenet: "Píntökön délután érnék rá, akkor van-e hely?"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      "Píntök" = péntek (2026-08-21), a napszak egyértelmű. A bolt hiányzik.
      Fontos, hogy a rendszer a MEGLÉVŐ adatot megtartsa, és csak a hiányzót
      kérdezze — a törpök 6. igénye (javítás, ne újrakezdés).
    cimkek: [tajszolas, reszleges_adat]

  # ---------------------------------------------------------------------
  # 3. réteg — elharapott, töredékes (4 eset)
  # ---------------------------------------------------------------------

  - id: toredekes-01
    bemenet: "kedden… petárda… lehet?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Táviratstílus, de minden kritikus mező kikövetkeztethető. A "kedd"
      a legközelebbi kedd (holnap). Ha a modell itt visszakérdez, az NEM
      hiba, csak gyengébb élmény — a golden set részleges pontot ad rá.
    reszleges_elfogadas:
      eszkoz: visszakerdez
      pontszam: 0.5
    cimkek: [toredekes, tavirat_stilus]

  - id: toredekes-02
    bemenet: "hát én csak azt szeretném hogy hogy mikor lehet menni"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      Szándék felismerhető (foglalás), de SEMMI konkrétum nincs benne.
      A helyes válasz zárt kérdés — nyitott kérdésre ("Mikor szeretne
      menni?") a beszélő valószínűleg ugyanilyen bizonytalanul válaszolna.
    cimkek: [toredekes, ismetles, nulla_konkretum]

  - id: toredekes-03
    bemenet: "időpont. holnap. délelőtt."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      A `megorzott_parameterek` a lényeg: a visszakérdezés után a dátumot
      NEM szabad újra megkérdezni. Ez a leggyakoribb hibaforrás — a
      részleges szándék elvesztése.
    cimkek: [toredekes, szandek_megorzes]

  - id: toredekes-04
    bemenet: "Szeretnék… izé… hogy is mondjam… bemenni a boltba valamikor a héten."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
    megjegyzes: >
      A töltelékszavak ("izé", "hogy is mondjam") nem hordoznak jelentést,
      de nem is szabad elakadni rajtuk. "A héten" = mától vasárnapig.
    cimkek: [toredekes, toltelekszo]

  # ---------------------------------------------------------------------
  # 4. réteg — szleng (3 eset)
  # ---------------------------------------------------------------------

  - id: szleng-01
    bemenet: "Van hely hónap délelőtt a petárdásnál? Kb 10 körül lenne jó"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T11:59:59Z"
        napszak: delelott
        preferalt_ora: 10
    megjegyzes: >
      Ugyanaz a "hónap = holnap" csapda, mint tajszolas-01-ben, de teljesen
      más regiszterben. A "kb 10 körül" preferencia, nem kemény szűrő.
    cimkek: [szleng, csapda_szo, preferencia]

  - id: szleng-02
    bemenet: "yo, be lehet nézni ma Törpillához vagy tele van?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-17T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A "vagy tele van?" nem külön kérdés, hanem ugyanannak a szándéknak
      a része. Ha nincs hely, a válasznak őszintének kell lennie és
      alternatívát kell adnia (törpök 5. igénye).
    cimkek: [szleng, ma, negativ_kimenet_lehetseges]

  - id: szleng-03
    bemenet: "asszem jövő csüt jó lenne, addig ráérek"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-27T00:00:00Z"
        datum_ig: "2026-08-27T23:59:59Z"
    megjegyzes: >
      "csüt" = csütörtök, "jövő csüt" = a KÖVETKEZŐ heti csütörtök
      (2026-08-27), nem a most csütörtök (08-20). Ez a megkülönböztetés
      a dátumparser egyik legkockázatosabb pontja — érdemes külön mérni.
    cimkek: [szleng, roviditett_nap, jovo_het_ertelmezes]

  # ---------------------------------------------------------------------
  # 5. réteg — kognitívan egyszerűsített, idős beszéd (4 eset)
  # ---------------------------------------------------------------------

  - id: egyszerusitett-01
    bemenet: "Jó napot kívánok. Én a Marika vagyok. Szeretnék elmenni a boltba. Mikor lehet?"
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
    megjegyzes: >
      A név NEM azonosító és nem is kell hozzá — böngészéshez semmi nem
      kell (blueprint 8. szakasz). A névnek a redaktálás után <NEV>-ként
      kell megjelennie a trace-ben; ha nyersen megmarad, az adatvédelmi
      hiba, és a teszt bukik.
    ellenorzes:
      trace_redaktalt: true
    cimkek: [egyszerusitett, udvariassagi_bevezetes, redakcio]

  - id: egyszerusitett-02
    bemenet: "Nem tudom hogy kell ezt. Időpont kell? Akkor kérek egyet. Holnapra."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
    megjegyzes: >
      A bizonytalanság kifejezése ("nem tudom hogy kell ezt") nem kérdés,
      amire válaszolni kell — türelmes, egyszerű nyelvű vezetés a helyes
      reakció, egy kérdéssel egy fordulóban.
    cimkek: [egyszerusitett, bizonytalansag, onmagaval_beszeles]

  - id: egyszerusitett-03
    bemenet: "Múltkor is voltam. Ugyanakkor szeretnék megint. Az délelőtt volt."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, ugyifogyi, torpilla]
      megorzott_parameterek:
        napszak: delelott
    megjegyzes: >
      A "múltkor" korábbi foglalásra utal, amit a rendszer azonosítás nélkül
      NEM kereshet vissza. A helyes viselkedés: a délelőttöt megtartja, a
      többit megkérdezi. Semmiképp NE találjon ki dátumot a "múltkor"-ból.
    tilos:
      - kitalalt_datum
    cimkek: [egyszerusitett, korabbi_foglalasra_utalas, azonositas_hianya]

  - id: egyszerusitett-04
    bemenet: "A fiam mondta hogy ide kell írni. Petárdát kéne venni. Mikor mehetek?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A bolt egyértelmű ("petárdát"), a dátum nyitott — ez elég a kereséshez.
      A "fiam mondta" kontextus, nem paraméter. A méret (kis/nagy petárda)
      hiányzik, de a keresés a bolt szintjén elindulhat; a szolgáltatás
      pontosítása jöhet az ajánlat után. Vitatható, hogy a "Mikor mehetek?"
      teljesen konkrétum nélküli zárófordulatra visszakérdezés is elfogadható
      válasz-e — ezért részleges pontot ad rá, a toredekes-01 mintájára.
    reszleges_elfogadas:
      eszkoz: visszakerdez
      pontszam: 0.5
    cimkek: [egyszerusitett, harmadik_szemely_kontextus, reszleges_szolgaltatas]

# -----------------------------------------------------------------------
# Kapuőr-esetek: NEM foglalási szándék. A rendszernek udvariasan el kell
# hárítania, nem szabad foglalási ágra terelnie.
# -----------------------------------------------------------------------

  - id: kapuor-01
    bemenet: "Milyen idő lesz holnap?"
    varhato:
      eszkoz: nincs
      kapuor_dontes: nem_foglalas
    cimkek: [kapuor, hatokoron_kivul]

  - id: kapuor-02
    bemenet: "Mennyibe kerül a nagy petárda?"
    varhato:
      eszkoz: nincs
      kapuor_dontes: nem_foglalas
    megjegyzes: >
      Az ár NEM engedélyezett tényválasz (csak nyitvatartás, cím, időtartam).
      A helyes reakció: jelezni, hogy erre nem tud válaszolni, és felajánlani
      a kiutat — nem kitalálni egy árat.
    tilos:
      - kitalalt_ar
    cimkek: [kapuor, hatokoron_kivul, hallucinacio_csapda]

# -----------------------------------------------------------------------
# Alkudozás — többfordulós esetek (roadmap M4, "szándék rétegzése":
# CLAUDE.md "Ha elakadsz" -> assistant/orchestrator.py::kovetkezo_kontextus).
# `bemenet` itt fordulólista, `varhato` az UTOLSÓ fordulóra vonatkozik.
# A kiértékelő (`tests/golden/futtato.py::szabaly_hivo`) fordulónként
# újraértelmez, a kontextust `kovetkezo_kontextus()`-szal viszi tovább —
# UGYANAZZAL a szabállyal, amit az orchestrator ténylegesen használ: a
# KEMÉNY rész (bolt, szolgáltatás) egy lezárt kereséstől (siker vagy
# kudarc) kezdve túléli a fordulót, a PUHA rész (dátum/napszak/óra)
# minden fordulóban frissen dől el. Ez az a mechanizmus, ami miatt egy
# alkudozó fordulóban a boltot nem kell újra kimondani.
# -----------------------------------------------------------------------

  - id: alkudozas-01-szukites
    bemenet:
      - "Szeretnék petárdázni valamikor a héten."
      - "és jövő héten péntek délelőtt?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-28T00:00:00Z"
        datum_ig: "2026-08-28T11:59:59Z"
        napszak: delelott
    megjegyzes: >
      Szűkítés: az 1. forduló teljes (kemény: ugyifogyi, puha: ez a hét,
      bármikor). A 2. forduló nem mondja ki újra a boltot — a kemény rész
      a kontextusból jön, csak a puha (dátum: jövő hét péntek, napszak:
      délelőtt) szűkül a mondatból.
    cimkek: [alkudozas, szukites, tobbfordulos]

  - id: alkudozas-02-tagitas
    bemenet:
      - "Szeretnék petárdázni kedden délelőtt."
      - "bármikor a jövő héten"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Tágítás: az 1. forduló egy konkrét napra (kedd) és napszakra
      (délelőtt) szűkít. A 2. forduló ("bármikor a jövő héten") a puha
      részt kitágítja az egész következő hétre — a kemény rész
      (ugyifogyi) változatlan, nem hangzik el újra.
    cimkek: [alkudozas, tagitas, tobbfordulos]

  - id: alkudozas-03-visszalepes
    bemenet:
      - "Szeretnék petárdázni kedden."
      - "és jövő héten péntek?"
      - "mégis maradjunk a keddinél"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Visszalépés egy korábbi ajánlathoz: a 2. forduló elviszi a
      keresést jövő hét péntekre, a 3. forduló szövegesen visszatér a
      kedden kimondott naphoz. A kemény rész (bolt) a teljes menetben
      egyszer sem hangzik el újra, mégis a végig helyes marad.
    cimkek: [alkudozas, visszalepes, tobbfordulos]

  - id: alkudozas-04-napszakvaltas
    bemenet:
      - "Szundihoz mennék valamikor a héten délelőtt."
      - "inkább este"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: este
    megjegyzes: >
      Napszakváltás: a 2. forduló ("inkább este") sem boltot, sem
      dátumot nem mond — csak a napszakot. A kemény rész (szundi +
      egyértelmű szolgáltatása, altato) megmarad; a dátum, mivel a 2.
      forduló nem mond konkrét napot, az általános (most-tól +7 napos)
      ablakra esik vissza — ez szándékos: a puha rész MINDEN fordulóban
      frissen dől el, nem ragad be a korábbi szűk ablakra.
    cimkek: [alkudozas, napszakvaltas, tobbfordulos]

  - id: alkudozas-05-boltvaltas
    bemenet:
      - "Szundihoz mennék valamikor a héten."
      - "inkább a Törpillához mennék"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Boltváltás: a 2. forduló EXPLICIT módon más boltot mond ki — ez
      felülírja a kontextust (a kemény rész itt szándékosan MOZOG, mert
      a mondat kimondja). A Szundihoz tartozó szolgáltatás nem öröklődik
      a Törpillára — az új bolt egyértelmű szolgáltatása (nagy_orom)
      töltődik be helyette, nem a régi bolt szolgáltatása marad rajta.
    cimkek: [alkudozas, boltvaltas, tobbfordulos]

  - id: alkudozas-06-elutasitas-utan-alternativa
    bemenet:
      - "Petárdázni szeretnék kedden."
      - "van esetleg más napon?"
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Elutasítás után alternatíva: a valós menetben az 1. forduló
      keresése kudarcot vallhat (nincs szabad hely kedden) — ez az
      interpreter szintjén nem látszik (ő nem tudja, volt-e találat),
      de az orchestrator ekkor is megőrzi a kemény részt (`assistant/
      orchestrator.py::_szabad_idopontok`, kudarctól függetlenül), így a
      2. forduló ("van esetleg más napon?") a boltot újramondás nélkül,
      általános ablakkal folytathatja a keresést.
    cimkek: [alkudozas, elutasitas_utan_alternativa, tobbfordulos]

# -----------------------------------------------------------------------
# Elengedés — a szándék KEMÉNY részének (bolt, szolgáltatás) elvetése egy
# későbbi fordulóban. Ez az a képesség, amit a determinisztikus réteg NEM
# tud: a szándék-rétegzés (ADR-016) a puha részt (dátum, napszak) magától
# elengedi egy lezárt keresés után, a keményet viszont szándékosan
# megtartja — épp ezért kell hozzá a modell (`assistant/interpreter/
# kaszkad.py`, elengedés-ág).
#
# `igenyel_llm: true` — ezek az esetek a determinisztikus alapvonalon
# VÁRHATÓAN buknak. Nem hiba: ez a golden set első olyan rétege, ami
# ténylegesen megkülönbözteti a szabály-alapú és a kaszkád értelmezőt.
# A `tests/egyseg/test_rule_based_golden_set.py` regressziós védőháló
# (ami a determinisztikus réteget őrzi) emiatt kihagyja őket — a
# `python feladat.py golden` viszont MINDEN értelmezőre jelenti.
#
# A várt értékeket a HELYES viselkedésből vezettük le, nem abból, amit a
# modell éppen ad (golden-set skill: "Ne a modell kimenetéből írj
# tesztesetet").
# -----------------------------------------------------------------------

  - id: elengedes-01-bolt
    bemenet:
      - "Petárdázni szeretnék kedden."
      - "és bármelyik másik boltban?"
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    megjegyzes: >
      A 2. forduló elveti a korábban megnevezett boltot, de nem nevez meg
      újat — a helyes válasz ezért zárt visszakérdezés a boltra. A
      determinisztikus réteg itt az ugyifogyi-t tartaná meg, mert a
      mondatban nincs olyan szó, amit szabállyal keresni lehetne;
      kulcsszólistát írni rá ráigazítás lenne.
    cimkek: [elengedes, kemeny_resz_elengedes, tobbfordulos]

  - id: elengedes-02-bolt-mas-megfogalmazas
    bemenet:
      - "Szeretnék időpontot a Szundiba szerdára."
      - "mindegy melyik bolt, csak legyen hely"
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    megjegyzes: >
      Ugyanaz a képesség, MÁS megfogalmazással — szándékosan, hogy a
      mérés ne egyetlen mondatra álljon be. A "mindegy melyik" itt a
      boltot engedi el, nem az időpontot.
    cimkek: [elengedes, kemeny_resz_elengedes, tobbfordulos]

  - id: elengedes-03-szolgaltatas
    bemenet:
      - "Nagy petárdát szeretnék kedden."
      - "mindegy milyen méret"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-23T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A kemény rész MÁSIK fele: a szolgáltatás (méret) esik ki, a bolt
      marad. A determinisztikus réteg a nagy_petarda-t tartaná meg.
      A dátum a 2. fordulóban nincs megnevezve, ezért az általános
      ablakra esik vissza — ez a szándék-rétegzés szerint helyes.
    cimkek: [elengedes, kemeny_resz_elengedes, tobbfordulos]

# -----------------------------------------------------------------------
# Nyelvi változatosság — amit MINTAILLESZTÉSSEL nem lehet megoldani
# (ADR-018). Ezek nem "nehezebb" esetek, hanem MÁS FAJTÁJÚAK: mindegyik
# olyan megfogalmazás, amihez a szabály-alapú rétegnek új mintát kellene
# felvenni, és a következő megfogalmazáshoz megint egy újat. Épp ezért
# mérik a fordított kaszkád létjogosultságát.
#
# `igenyel_llm: true` — a determinisztikus alapvonalon várhatóan buknak
# (l. az `elengedes` réteg fejlécének azonos indoklását).
# -----------------------------------------------------------------------

  - id: valtozatossag-01-vagylagos
    bemenet: "Jövő héten, vagy szeptember 4-én tudok menni a petárdáshoz."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-09-04T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Vagylagos időpont: a vásárló KÉT lehetőséget ad. A helyes ablak
      mindkettőt lefedi (az elsőtől az utolsóig) — a pontozó úgyis a
      ténylegesen szabad slotokból választ. A determinisztikus réteg a
      `hun_date_parser` első találatát veszi, és a "szeptember 4"
      lehetőséget csendben elveszíti.
    cimkek: [valtozatossag, vagylagos]

  - id: valtozatossag-02-lemondas-minta-nelkul
    bemenet: "Nem tudok elmenni a péntekire, a kód X7K2M9QP."
    igenyel_llm: true
    varhato:
      eszkoz: foglalas_lemondas
      parameterek:
        foglalasi_kod: "X7K2M9QP"
    megjegyzes: >
      Lemondás a "lemond" szó NÉLKÜL. A determinisztikus réteg
      `_LEMONDAS_MINTA`-ja ezt nem fogja meg, ezért keresésre terel —
      és mivel boltot sem talál, visszakérdez. Ez a legrosszabb fajta
      hiba: a vásárló lemondani akar, a rendszer pedig foglalni.
    cimkek: [valtozatossag, lemondas_korulras]

  - id: valtozatossag-03-bolt-termek-szerint
    bemenet: "Ahol a durranókat árulják, oda mennék holnap."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A bolt a TERMÉK köznyelvi szinonimájával körülírva ("durranó" a
      petárda helyett). A `_BOLT_MINTAK` a "petárd" szótövet ismeri,
      ezt nem — és minden további szinonima újabb mintát igényelne.
    cimkek: [valtozatossag, bolt_korulras_szinonimaval]

  - id: valtozatossag-04-bolt-megjelenes-szerint
    bemenet: "A csillagos kirakatú boltba szeretnék bejutni szerdán."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-19T00:00:00Z"
        datum_ig: "2026-08-19T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A bolt a MEGJELENÉSÉVEL azonosítva (a Szundi kék, csillagos
      homlokzatú — `seed/betolt.py`). Ezt mintával reménytelen: a
      megjelenés szerkesztett, admin által bármikor átírható adat.
    cimkek: [valtozatossag, bolt_megjelenes_szerint]

  - id: valtozatossag-05-ures-keres
    bemenet: "Valamikor mennék."
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    megjegyzes: >
      Teljesen üres kérés — se bolt, se időpont. A helyes válasz zárt
      kérdés, NEM találgatás. Ezt a determinisztikus réteg is tudja
      (ezért nincs `igenyel_llm`), de a fordított kaszkádnak sem szabad
      elrontania: ez a réteg regressziós horgonya, ami azt méri, hogy a
      modell nem kezd el kitalálni.
    cimkek: [valtozatossag, ures_keres]

# -----------------------------------------------------------------------
# Mintaillesztésen túl (`mintan_tul`) — mondattani ALAKZATOK, nem nehezebb
# szavak. Mindegyik esetben a mondat két, egyenrangúnak LÁTSZÓ értéket
# tartalmaz (két időpont, két napszak, két kérés), és a SZERKEZET dönti
# el, melyik a kért — nem az, hogy melyik szó szerepel benne. Egy
# szólistás/regexes réteg elvileg nem tud különbséget tenni köztük: a
# szólista mindkét szót megtalálja, és mindig ugyanazt választja.
#
# `igenyel_llm: true` mindegyiken — a determinisztikus regressziós
# védőháló (`tests/egyseg/test_rule_based_golden_set.py`) kihagyja őket,
# a `python feladat.py golden` MINDEN értelmezőre jelenti.
#
# **Őszinte megjegyzés a réteg erejéről:** a kilenc esetből a
# determinisztikus réteg többet is megold — nem azért, mert érti a
# szerkezetet, hanem mert VÉLETLENÜL jó irányba dől el (pl. a "28-án"
# beleesik a "jövő hét" ablakába; a napszak-minták sorrendje éppen a
# kért napszakot adja). A 04. és a 09. eset egymás TÜKRE, pontosan ezért:
# a szerkezet ugyanaz, csak a két napszak fel van cserélve — a
# mintaillesztés mindkettőre ugyanazt (`delelott`) adja, tehát az egyiket
# szükségszerűen elrontja. A réteg értéke ebben a párban van, nem az
# egyes esetek nehézségében.
# -----------------------------------------------------------------------

  - id: mintan_tul-01-vagylagos
    bemenet:
      - "Petárdázni szeretnék."
      - "jövő héten, vagy 28-án tudok menni?"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Vagylagos időpont: a vásárló KÉT lehetőséget ad. A helyes ablak
      mindkettőt lefedi — itt a 28-a amúgy is a jövő héten van, ezért az
      unió maga a jövő hét. A determinisztikus réteg ezt VÉLETLENÜL
      eltalálja (a "héten" szóra rövidre zár, a második lehetőséget meg
      sem nézi); ha a második dátum a hét ablakán kívülre esne (l.
      valtozatossag-01: "szeptember 4-én"), csendben elveszítené.
    cimkek: [mintan_tul, vagylagos, tobbfordulos]

  - id: mintan_tul-02-ures-szandek
    bemenet: "Valamikor mennék, ha lehet."
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
    megjegyzes: >
      Üres szándék: felismerhető, hogy menni akar, de semmi konkrétum
      nincs. A helyes válasz zárt kérdés, NEM találgatás. A
      valtozatossag-05 ("Valamikor mennék.") ennek a csupasz ikerpárja —
      szándékosan maradt külön rétegben, hogy ez a réteg is hordozzon
      egy horgonyt arra, hogy a modell nem kezd el kitalálni.
    cimkek: [mintan_tul, ures_szandek]

  - id: mintan_tul-03-felteteles
    bemenet:
      - "Szeretnék időpontot a Szundiba."
      - "ha van hely szerdán, akkor az jó, ha nincs, akkor csütörtök"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-19T00:00:00Z"
        datum_ig: "2026-08-20T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Feltételes szerkezet: a mondat egy ELSŐDLEGES és egy TARTALÉK napot
      ad meg. A helyes ablak mindkettőt lefedi (szerda 00:00 – csütörtök
      23:59), mert a pontozó úgyis a ténylegesen szabad slotokból választ,
      és a sorrendet az ajánlat rendezése adja vissza — nem a szűrés. A
      determinisztikus réteg a `hun_date_parser` ELSŐ találatát veszi
      (szerda), a csütörtököt elveszíti.
    cimkek: [mintan_tul, felteteles, tobbfordulos]

  - id: mintan_tul-04-indoklas
    bemenet: "Azért kellene délelőtt, mert délután dolgozom."
    igenyel_llm: true
    varhato:
      eszkoz: visszakerdez
      hianyzo_mezo: bolt_id
      varhato_kerdes_tipusa: zart
      valaszthato_ertekek: [szundi, torpilla, ugyifogyi]
      megorzott_parameterek:
        napszak: delelott
    megjegyzes: >
      Indoklás mellékmondattal: a mellékmondat napszaka ("délután") az,
      amit a vásárló KIZÁR. A bolt hiányzik, ezért zárt kérdés a helyes
      válasz — de a felismert napszakot át kell vinni, nem szabad újra
      megkérdezni. A mintaillesztés ezt eltalálja, mert a
      `_NAPSZAK_MINTAK` listájában a "délelőtt" áll elöl — nem azért,
      mert érti a mondatot. A tükörpárja (09.) ugyanezt a szerkezetet
      fordítva méri, és ott ez a sorrend elrontja.
    tilos:
      - kitalalt_datum
    cimkek: [mintan_tul, indoklas_mellekmondattal]

  - id: mintan_tul-05-kettos-keres
    bemenet: "A Törpillánál mikor van nyitva, és tudok-e ma menni?"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-17T09:00:00Z"
        datum_ig: "2026-08-17T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Két kérés egy mondatban: egy ténykérdés (nyitvatartás) és egy
      foglalási szándék (ma). Egy fordulóban egy eszköz hívható, tehát
      választani KELL. A keresés a helyes választás, mert az ajánlott
      időpontok maguk is a nyitvatartáson belül vannak — a keresés
      válasza tehát implicit módon a ténykérdésre is válaszol, fordítva
      viszont nem. A tényválasz (`bolt_info`) ezért nem hiba, csak
      gyengébb: fél pontot ér. A determinisztikus réteg a "nyitva" szóra
      illeszkedik előbb, ezért mindig a gyengébbet választja.
    reszleges_elfogadas:
      eszkoz: bolt_info
      pontszam: 0.5
    cimkek: [mintan_tul, kettos_keres]

  - id: mintan_tul-06-visszavonas
    bemenet:
      - "Petárdázni szeretnék kedden."
      - "és jövő héten péntek?"
      - "mégsem, inkább maradjunk a keddnél"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Visszavonás: a 3. forduló ELVETI a 2. fordulót, és visszatér az
      1.-hez. A "mégsem" önmagában nem hordoz dátumot — a "keddnél"
      viszont igen, ezért ez az eset a mintaillesztésnek is megoldható.
      Azért van benne, mert a visszavonás a leggyakoribb valós alkudozó
      lépés, és a modellnek NEM szabad elrontania (regressziós horgony,
      az alkudozas-03 párja más megfogalmazással).
    cimkek: [mintan_tul, visszavonas, tobbfordulos]

  - id: mintan_tul-07-bizonytalan
    bemenet:
      - "Szundihoz mennék."
      - "talán jövő héten, még nem tudom biztosan"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Bizonytalanság: a "talán" és a "még nem tudom biztosan" NEM ok a
      visszakérdezésre — a mondat egy használható ablakot ad meg (jövő
      hét), a keresésnek el kell indulnia. A hibás viselkedés az lenne,
      ha a bizonytalanság szavaitól a rendszer maga is bizonytalanná
      válna, és zárt kérdéssel válaszolna egy már megválaszolt kérdésre.
    cimkek: [mintan_tul, bizonytalansag_jelzese, tobbfordulos]

  - id: mintan_tul-08-koznyelvi-toltelek
    bemenet:
      - "Törpillához mennék."
      - "hát izé, valamikor a jövő hét elején lenne jó"
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-24T00:00:00Z"
        datum_ig: "2026-08-30T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      Köznyelvi töltelék ("hát izé", "valamikor") egy egyébként
      használható időmegjelölés körül. A töltelék nem hordoz jelentést,
      de nem is szabad elakadni rajta. **Ismert korlát:** a "hét eleje"
      (hétfő–szerda) szűkítést ma egyik réteg sem modellezi — a várt
      érték ezért a teljes jövő hét. Ez tudatos v1 döntés, nem a
      helyes viselkedés meghamisítása: a szűkebb ablak megépítése külön
      lépés lenne, és amíg nincs meg, nem mérünk rá.
    cimkek: [mintan_tul, toltelekszo, tobbfordulos]

  - id: mintan_tul-09-indoklas-tukor
    bemenet: "A petárdáshoz azért délután mennék holnap, mert délelőtt dolgozom."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T17:59:59Z"
        napszak: delutan
    megjegyzes: >
      A 04. eset TÜKRE: ugyanaz a szerkezet, a két napszak felcserélve.
      Itt a kért napszak a "délután", a kizárt a "délelőtt". A
      determinisztikus réteg a `_NAPSZAK_MINTAK` sorrendje miatt itt is
      "délelőtt"-öt ad — ez a bizonyíték arra, hogy a 04. esetet nem
      megértette, hanem eltalálta. Egy szólistás réteg ezt a párt
      elvileg nem tudja EGYSZERRE megoldani: a szerkezet, nem a
      szókészlet dönti el, melyik napszak a kért.
    cimkek: [mintan_tul, indoklas_mellekmondattal]

# -----------------------------------------------------------------------
# „Mindegy" — az ELENGEDETT mező (ADR-024, `katalogus.MINDEGY`)
#
# Három állapot van, nem kettő: a hiányzó mezőre KÉRDEZÜNK, az elengedett
# mezőre NEM kérdezünk többé (mindenben keresünk), a konkrét értékre
# szűkítünk. A hiba, amit ez a réteg mér: a „mindegy melyik" korábban
# ugyanoda vezetett, mint a hallgatás — a mező üres maradt, a rendszer
# pedig újra rákérdezett arra, amit a vásárló épp elengedett.
#
# **Miért nyelvi réteg és nem kulcsszólista.** A „mindegyik" és a
# „mindegy" szótöve azonos, a jelentésük ellentétes: az egyik LISTÁT kér
# (mutasd az összeset), a másik elenged (ne kérdezz többet). Egy
# szólista a kettőt nem tudja megkülönböztetni; a mondattan igen, és ez
# a modell dolga — ezért `igenyel_llm: true` az egész réteg.
#
# Az ellenpróbák (05, 06) legalább olyan fontosak, mint a pozitív
# esetek: egy réteg, ami mindenre MINDEGY-et mond, 100%-ot érne el a
# pozitív eseteken, és használhatatlan lenne.
# -----------------------------------------------------------------------

  - id: mindegy-01-szolgaltatas
    bemenet: "Bármelyik petárda jó, csak csütörtökön legyen."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        szolgaltatas_id: MINDEGY
        datum_tol: "2026-08-20T00:00:00Z"
        datum_ig: "2026-08-20T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A „bármelyik" itt ELENGEDÉS, nem hiány. A rossz válasz nem a
      kitalált érték (azt az enum kizárja), hanem az ÜRESEN HAGYOTT
      mező: abból a rendszer azt olvassa, hogy nem tudjuk, és a
      következő fordulóban rákérdez a méretre — arra, amit a vásárló
      épp az imént engedett el. Az Ügyifogyihoz két slug tartozik
      (kis/nagy petárda), tehát a mező nem tölthető ki a boltból sem.
    cimkek: [mindegy, elengedett_mezo]

  - id: mindegy-02-napszak
    bemenet: "A Törpillához mennék pénteken, nekem tényleg nem számít, hány órára."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: torpilla
        szolgaltatas_id: nagy_orom
        datum_tol: "2026-08-21T00:00:00Z"
        datum_ig: "2026-08-21T23:59:59Z"
        napszak: MINDEGY
    megjegyzes: >
      A „nem számít, hány órára" a napszak elengedése. A KERESÉS
      szempontjából ez ugyanaz, mint a „barmikor" alapértelmezés
      (`szabad_idopontok.napszak_ertek`), a SZÁNDÉK szempontjából nem:
      a „barmikor" a mi feltevésünk, a MINDEGY a vásárló kimondott
      döntése. Ezért kerül át a kontextusba is — hogy egy későbbi
      szűkítő javaslat ne kerüljön szembe azzal, amit kimondott.
    cimkek: [mindegy, elengedett_mezo]

  - id: mindegy-03-pult
    bemenet: "Mindegy, melyik pultnál, csak legyen hely holnap a petárdásnál."
    igenyel_llm: true
    varhato:
      eszkoz: szabad_idopontok
      parameterek:
        bolt_id: ugyifogyi
        datum_tol: "2026-08-18T00:00:00Z"
        datum_ig: "2026-08-18T23:59:59Z"
        napszak: barmikor
    megjegyzes: >
      A pultra a rendszer SOHA nem szűkít (ADR-024: a keresés bolt és
      szolgáltatás szerint megy, a pult csak a slot generálásában
      szerepel), tehát a „mindegy, melyik pultnál" olyan mezőt enged
      el, amit nem is kérdeztünk volna. Épp ezért jó teszteset: a
      helyes viselkedés az, hogy a mondat NEM zavarja meg — nem
      keletkezik belőle se visszakérdezés, se kitalált paraméter. A
      várt kimenetben nincs `pult` mező, mert olyan mező nincs a
      sémában.

      **MÉRT BUKÁS (2026-08-30, qwen3.5:9b, három futásból három):** a
      modell a MINDEGY-et átviszi a SZOMSZÉD mezőre is
      (`szolgaltatas_id: MINDEGY`), pedig a mondat a pultról beszél. A
      várt érték ettől nem lesz más: az elengedés kimondott döntés, és
      a szolgáltatást (ami a foglalás hosszát adja) itt senki nem
      engedte el. Ez az eset ezért NEM „majdnem jó" — a
      MINDEGY túláltalánosítása pont az a hiba, amit a szentinel
      bevezetése olcsóvá tett, és amit mérni akarunk.

  - id: mindegy-04-legkorabbi-elengedessel
    bemenet: "Nekem tényleg mindegy mikor, csak a legkorábbi legyen az altatóshoz."
    igenyel_llm: true
    varhato:
      eszkoz: legkozelebbi_idopont
      parameterek:
        bolt_id: szundi
        szolgaltatas_id: altato
    megjegyzes: >
      Az időpont elengedése + a „legkorábbi" kérése EGYÜTT: nem
      dátumablakot kér, hanem EGY konkrét választ. A rossz viselkedés
      itt a visszakérdezés lenne („mikorra szeretnél időpontot?") —
      arra, amit a mondat épp megválaszolt. A Szundi szolgáltatása
      egyértelmű, ezért kitölthető.
    cimkek: [mindegy, legkorabbi]

  - id: mindegy-05-ellenproba-mindegyik-lista
    bemenet: "Mindegyik boldogság-fajta érdekel, mi mindent lehet kapni a Törpillánál?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: torpilla
        mit: termek
    megjegyzes: >
      ELLENPRÓBA. A „mindegyik" nem elengedés, hanem LISTA-kérés: a
      vásárló nem azt mondja, hogy ne kérdezzünk többet, hanem azt,
      hogy mutassuk meg az összeset. Ha erre MINDEGY-gyel válaszolna a
      rendszer, egy keresést indítana egy kérdés helyett — udvariasan,
      de a kérdés megválaszolása nélkül.
    cimkek: [mindegy, ellenproba]

  - id: mindegy-06-ellenproba-mindegy-nekem-melyik-nap
    bemenet: "Mindegyik nap érdekelne, mikor van egyáltalán nyitva a Szundi?"
    igenyel_llm: true
    varhato:
      eszkoz: bolt_info
      parameterek:
        bolt_id: szundi
        mit: nyitvatartas
    megjegyzes: >
      ELLENPRÓBA a 03-ra: ugyanaz a szótő („mindegyik"), ugyanaz a
      mezőnév-környezet (nap), és mégsem keresés — a mondat MÁSODIK
      fele a valódi kérés, egy engedélyezett tényválasz. Az elsőt
      önmagában olvasva a „mindegyik nap" akár napszak-elengedésnek is
      látszana; a mondat egészét olvasva nem az.
    cimkek: [mindegy, ellenproba]
