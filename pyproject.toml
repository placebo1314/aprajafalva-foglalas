[project]
name = "aprajafalva-foglalas"
version = "0.1.0"
description = "Magyar nyelvű, lokálisan futó időpontfoglaló Aprajafalva három boltjához."
requires-python = ">=3.11"
dependencies = [
    # A zoneinfo (stdlib) Windows/macOS friss telepítésen nem talál
    # rendszer-tzdatabázist — a DST-számításokhoz (mag/slot/generator.py,
    # seed/betolt.py) ez explicit futásidejű függőség, nem csak dev-eszköz.
    "tzdata>=2024.1",
]

# A hun-date-parser és a huspacy tudatosan nincs itt — csak az M4
# (Asszisztens) mérföldkőnél kellenek, addig a mag/ LLM és dátumparser
# nélkül, önmagában fut. Lásd docs/roadmap.md, M4.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
# Explicit lista kell (a setuptools flat-layout auto-discovery kettőnél több
# gyökérkönyvtárnál hibát dob) — a CLAUDE.md "Modulhatárok" szakaszának
# csomagjai, plusz a seed/ (importként hívva: `python -m seed.betolt`).
# A tesztek/, spike/, eszkozok/, migraciok/, docs/ szándékosan kimarad:
# ezek nem csomagolt könyvtári kód. Az asszisztens/, adatvedelem/, felulet/
# ma még __init__.py nélküli váz — a minta itt van előkészítve, hogy amint
# valódi csomaggá válnak (M4/M5), automatikusan bekerüljenek.
include = ["mag*", "seed*", "asszisztens*", "adatvedelem*", "felulet*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# A .claude/ eszköz-/skillkonfiguráció, a docs/ pedig prózai dokumentáció —
# a bennük lévő példakód-részletek illusztrációk, nem alkalmazáskód, ezért
# nem esnek a formázási/lint kényszer alá (ruff a markdown fájlokban lévő
# python kódrészleteket is formázza alapból, ami ezekre nem értelmezhető).
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tesztek"]
